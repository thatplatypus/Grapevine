<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Grapevine</title>
  <!-- A bunch of grapes on the vine it grew on. It is drawn the way the Blazemoji flame and
       the Packmoji box are, and the wood of its cane is the cardboard of that box, but it
       has no eyes, which those two have. -->
  <defs>
    <linearGradient id="purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BE8CF7"/>
      <stop offset="1" stop-color="#6A31B6"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A3DB5C"/>
      <stop offset="1" stop-color="#4C9A2A"/>
    </linearGradient>
    <!-- The wood is measured against the drawing and not against each shape, so that the
         cane and the stalk are shaded as one piece of it. -->
    <linearGradient id="wood" x1="0" y1="40" x2="0" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#DDA15E"/>
      <stop offset="1" stop-color="#BC7A3C"/>
    </linearGradient>
    <g id="berry">
      <circle r="40" fill="url(#purple)" stroke="#4B2388" stroke-width="6"/>
      <ellipse cx="-14" cy="-17" rx="11" ry="7" fill="#fff" opacity="0.7" transform="rotate(-38 -14 -17)"/>
    </g>
  </defs>
  <path id="cane" fill="none" stroke="url(#wood)" stroke-width="24" stroke-linecap="round" d="M36 122C86 84 150 68 256 80S420 94 478 50"/>
  <path id="stalk" fill="none" stroke="url(#wood)" stroke-width="18" stroke-linecap="round" d="M256 82C251 106 259 130 256 160"/>
  <path id="tendril" fill="none" stroke="#6FB53C" stroke-width="11" stroke-linecap="round" transform="translate(150 80)" d="M0 0C-22 14 -88 22 -90 76A28 28 0 0 0 -34 76A20 20 0 0 0 -74 76A12 12 0 0 0 -50 76"/>
  <g id="bunch">
    <use href="#berry" x="178" y="190"/>
    <use href="#berry" x="256" y="190"/>
    <use href="#berry" x="334" y="190"/>
    <use href="#berry" x="139" y="252"/>
    <use href="#berry" x="217" y="252"/>
    <use href="#berry" x="295" y="252"/>
    <use href="#berry" x="373" y="252"/>
    <use href="#berry" x="178" y="314"/>
    <use href="#berry" x="256" y="314"/>
    <use href="#berry" x="334" y="314"/>
    <use href="#berry" x="217" y="376"/>
    <use href="#berry" x="295" y="376"/>
    <use href="#berry" x="256" y="438"/>
  </g>
  <g id="leaf" transform="translate(350 66) rotate(-25)">
    <path fill="url(#green)" stroke="#3A7A22" stroke-width="6" stroke-linejoin="round" d="M0 6C-14 -18 -58 -22 -74 8C-60 14 -48 26 -44 42C-58 52 -68 70 -66 92C-50 86 -36 88 -24 96C-20 114 -12 130 0 146C12 130 20 114 24 96C36 88 50 86 66 92C68 70 58 52 44 42C48 26 60 14 74 8C58 -22 14 -18 0 6Z"/>
    <path fill="none" stroke="#3A7A22" stroke-width="5" stroke-linecap="round" opacity="0.6" d="M0 16V122M0 16L-54 10M0 16L54 10M0 16L-48 72M0 16L48 72"/>
  </g>
</svg>
