<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grapevine todos</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main>
    <header>
      <h1>Grapevine todos</h1>
      <p class="lede">A page of plain HTML, CSS and JavaScript. Grapevine serves it, and it talks to Grapevine's API.</p>
    </header>

    <form id="add-form" novalidate>
      <label for="title">What needs doing?</label>
      <div class="row">
        <input id="title" name="title" type="text" autocomplete="off" data-testid="title-input">
        <button type="submit" data-testid="add-button">Add</button>
      </div>
    </form>

    <div id="message" class="message" role="status" aria-live="polite" data-testid="message"></div>

    <div class="filters" role="group" aria-label="Show">
      <button type="button" data-filter="all" aria-pressed="true" data-testid="filter-all">All</button>
      <button type="button" data-filter="open" aria-pressed="false" data-testid="filter-open">Open</button>
      <button type="button" data-filter="done" aria-pressed="false" data-testid="filter-done">Done</button>
    </div>

    <ul id="todos" class="todos" aria-label="Todos"></ul>
    <p id="count" class="count" data-testid="count"></p>
  </main>

  <footer>
    <p>
      API at <span id="api-origin" data-testid="api-origin"></span>:
      <span id="api-status" class="status" data-testid="api-status">checking</span>
    </p>

    <section class="account" aria-label="For the admin">
      <form id="sign-in-form" class="sign-in" novalidate data-testid="sign-in-form">
        <div class="field">
          <label for="user">Name</label>
          <input id="user" name="user" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" data-testid="user-input">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" data-testid="password-input">
        </div>
        <button type="submit" data-testid="sign-in-button">Sign in</button>
      </form>

      <div id="signed-in" class="signed-in" hidden data-testid="signed-in">
        <div>
          <p id="who" data-testid="who"></p>
          <p id="numbers" data-testid="numbers"></p>
        </div>
        <button type="button" id="sign-out" aria-describedby="who" data-testid="sign-out-button">Sign out</button>
      </div>

      <div id="account-message" class="message" role="status" aria-live="polite" data-testid="account-message"></div>
    </section>
  </footer>

  <template id="todo-row">
    <li class="todo" data-testid="todo">
      <label class="check">
        <input type="checkbox" data-testid="todo-done">
        <span class="title" data-testid="todo-title"></span>
      </label>
      <button type="button" class="delete" data-testid="todo-delete">Delete</button>
    </li>
  </template>
</body>
</html>
