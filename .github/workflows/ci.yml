# Checks every pull request, and main after a merge. The checks need no secret.
#
# Each job runs a script that also runs on a developer's machine, so a failure here can be
# had again at a desk: ./build.sh test in the image, ./test-wire.sh, ./test-e2e.sh and
# ./test-release.sh.
#
# The workflow that makes a release calls this one first, and releases what the last job
# here packed.
name: CI

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# A newer push to a pull request makes the run for the older one pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - name: Checkout
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

    # The Emojicode compiler is an x86_64 Linux program with a library of its own to install,
    # so everything is built and run in the image the Dockerfile makes for that.
    - name: Build the image
      run: docker build -t grapevine .

    # The lint, the check that each package can be released by itself, the unit tests, the
    # fuzzers, the sample's own tests and its smoke test.
    - name: Run the tests that need no network
      run: docker run --rm grapevine ./build.sh test

  wire:
    name: Wire tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - name: Checkout
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

    # The global.json beside the tests names their runner and no SDK, so the SDK is named here.
    - name: Setup .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
      with:
        dotnet-version: 10.0.x

    # Builds the image, then drives containers of it over real sockets.
    - name: Run the wire tests
      run: ./test-wire.sh

    # What each server wrote. For a request that was never answered it is the only record
    # there is, and the tests keep it beside their assembly.
    - name: Keep the servers' logs of a failed run
      if: failure()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: wire-server-logs
        path: tests/wire/bin/**/server-logs
        retention-days: 7
        if-no-files-found: ignore

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - name: Checkout
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

    - name: Setup .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
      with:
        dotnet-version: 10.0.x

    # Builds the image, then drives the sample's page in headless Chromium, which the tests
    # download themselves the first time they run.
    - name: Run the browser tests
      run: ./test-e2e.sh

    # What each server wrote. For a request that was never answered it is the only record
    # there is, and the tests keep it beside their assembly.
    - name: Keep the servers' logs of a failed run
      if: failure()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: browser-server-logs
        path: tests/e2e/bin/**/server-logs
        retention-days: 7
        if-no-files-found: ignore

  rehearsal:
    name: Release rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The commit of Packmoji that pmj is built from, until Packmoji releases a pmj to
      # download. It moves on purpose, and never by itself.
      PACKMOJI_COMMIT: 65e68a67a95b4539056bb54d4773e8c6122677de
    steps:
    - name: Checkout
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      with:
        # The whole history, for its tags: a version that is released is held to its tag.
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
      with:
        dotnet-version: 10.0.x

    # The native linker needs clang and zlib, which the runner image is not promised to keep.
    - name: Install what the native linker needs
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev

    # Outside the checkout, so that nothing of Packmoji is in what the image is built from.
    - name: Build pmj
      run: |
        git init --quiet "$RUNNER_TEMP/packmoji"
        cd "$RUNNER_TEMP/packmoji"
        git fetch --quiet --depth 1 https://github.com/thatplatypus/Packmoji.git "$PACKMOJI_COMMIT"
        git checkout --quiet FETCH_HEAD
        dotnet publish src/Packmoji.Cli -c Release -r linux-x64
        echo "PMJ=$PWD/src/Packmoji.Cli/bin/Release/net10.0/linux-x64/publish/pmj" >> "$GITHUB_ENV"

    # Packs each package with pmj, adds each to an application from a stand-in for GitHub,
    # and builds from what pmj unpacked. It releases nothing.
    - name: Rehearse a release of each package
      run: ./test-release.sh

    # What a release of each package would be, of this commit: the files, the lockfile of the
    # application each was added to, and a line for each. The workflow that makes a release
    # takes them from here.
    - name: Keep what was packed
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: release-rehearsal
        path: |
          build/release/files
          build/release/locks
          build/release/summary.txt
        retention-days: 7
        if-no-files-found: error
